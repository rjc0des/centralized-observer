# Template: render.sh fills the ${...} placeholders from the container environment
# at start (Alertmanager can't read environment variables itself). Values come from
# .env; when unset, email goes to Mailpit (http://127.0.0.1:8025) and Slack messages
# to alert-sink, so routing works locally without real credentials. The webhook goes
# to the incident API (apps/incident-api), which turns alerts into incidents.
# Edits need `make reload` (re-renders, then reloads).
global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_SMARTHOST}"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_AUTH_USERNAME}"
  smtp_auth_password: "${SMTP_AUTH_PASSWORD}"
  smtp_require_tls: ${SMTP_REQUIRE_TLS}
  slack_api_url: "${SLACK_WEBHOOK_URL}"

# critical -> webhook + email + Slack. Changes to the group (new alerts, recovery) go
#             out within 1 minute; re-sent hourly while firing.
# warning  -> webhook + Slack. Changes within 5 minutes; re-sent every 4 hours.
# Every receiver sends recovery ("resolved") notifications.
route:
  receiver: warning
  group_by: [alertname, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      group_interval: 1m
      repeat_interval: 1h

# Mute an alert while a higher-level alert already explains it. Labels listed in
# `equal` must match; a label missing on both sides counts as matching.
# The incident API's correlation rules (apps/incident-api/app/correlation.py) use the
# same cause -> symptom pairs: change both together.
inhibit_rules:
  # Critical twin of the same alert on the same target (e.g. DiskSpaceLow at 5% vs 15%).
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, environment, instance, device]
  # The target-specific alert already says this target is down.
  - source_matchers: [alertname=~"InstanceDown|ApplicationDown"]
    target_matchers: [alertname="PrometheusTargetMissing"]
    equal: [job, instance]
  # Postgres (the e-commerce database) down is the cause of that API's 5xx, its
  # availability budget burn and its failing health check. Other services have their own.
  - source_matchers: [alertname="DatabaseUnavailable"]
    target_matchers: [alertname=~"HighHTTPErrorRate|ErrorBudgetFastBurn|ErrorBudgetSlowBurn|EndpointDown", service="ecommerce-api"]
    equal: [environment]
  # An app's failing health check is explained by that app being down.
  - source_matchers: [alertname="ApplicationDown"]
    target_matchers: [alertname="EndpointDown"]
    equal: [environment, service]

receivers:
  - name: critical
    # The incident API accepts webhooks even while its database is down (spool). If the API
    # itself is down, a failed POST is retried until the flush times out and at each later
    # flush, but only while the alert still fires: no firing delivered = no resolved sent.
    webhook_configs: &webhook
      - url: http://incident-api:8000/alertmanager
        send_resolved: true
        http_config:
          authorization:
            credentials: "${INCIDENT_API_TOKEN}"
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true
    slack_configs: &slack
      - send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'

  - name: warning
    webhook_configs: *webhook
    slack_configs: *slack
