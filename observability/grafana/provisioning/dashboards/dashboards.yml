apiVersion: 1

# Dashboards are JSON files in this directory, read-only in the UI. To change one:
# edit it in Grafana, Save as JSON (Export > Export as JSON), replace the file here.
providers:
  - name: cop
    folder: COP
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
