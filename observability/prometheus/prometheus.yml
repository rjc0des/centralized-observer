global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# Monitoring-stack components are static (one per Prometheus).
# Hosts, containers and probes come from targets/*.yml (file_sd): adding an AWS host
# means dropping a target file in place, no change to this file and no restart
# (Prometheus watches the files: measured ~3s to apply; full re-read every 5m as fallback).
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox:9115]

  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node*.yml]

  - job_name: cadvisor
    file_sd_configs:
      - files: [/etc/prometheus/targets/cadvisor*.yml]

  # Synthetic uptime checks: each target URL is probed through Blackbox Exporter.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/probe-http*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
