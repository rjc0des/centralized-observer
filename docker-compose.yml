name: cop

# Images are pinned to tag + multi-arch index digest (linux/arm64 and linux/amd64).
# Published ports bind to 127.0.0.1 only; exporters are reachable only inside the network.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Local AWS API emulator. Runs as uid 1001 (the image's entrypoint drops root)
  # and ships its own healthcheck against /_floci/init.
  floci:
    image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    environment:
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-persistent}
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    volumes:
      - floci-data:/app/data
    restart: unless-stopped
    logging: *logging

  # --- Application workload --------------------------------------------------

  # One-shot schema migration job: same image, owner role. Runs to completion
  # before the API starts; re-running it is a no-op once migrations are applied.
  ecommerce-migrate:
    image: cop/ecommerce-api:dev
    # Local image only. "cop/..." is an unclaimed Docker Hub namespace: pulling it
    # could fetch someone else's image and hand it the owner password.
    pull_policy: never
    command: ["node", "src/migrate.js"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      PGHOST: postgres
      PGDATABASE: ecommerce
      PGUSER: ecommerce_owner
      PGPASSWORD: ${ECOMMERCE_OWNER_PASSWORD:?set ECOMMERCE_OWNER_PASSWORD in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  ecommerce-api:
    build: ./apps/ecommerce-api
    image: cop/ecommerce-api:dev
    pull_policy: build   # always built locally, never pulled (see ecommerce-migrate)
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PGHOST: postgres
      PGDATABASE: ecommerce
      PGUSER: ecommerce_app
      PGPASSWORD: ${ECOMMERCE_APP_PASSWORD:?set ECOMMERCE_APP_PASSWORD in .env}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:3000"
    # Hardening: read-only root filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      ecommerce-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Shared by the e-commerce API now and the incident service in Phase 5 (separate
  # databases and roles). Not published to the host.
  postgres:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ECOMMERCE_OWNER_PASSWORD: ${ECOMMERCE_OWNER_PASSWORD:?set ECOMMERCE_OWNER_PASSWORD in .env}
      ECOMMERCE_APP_PASSWORD: ${ECOMMERCE_APP_PASSWORD:?set ECOMMERCE_APP_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 checks TCP. The default Unix socket is already up during first-boot
      # init (temporary server, listen_addresses=''), when clients over TCP still fail.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Cache only: no persistence, LRU eviction at 64 MB. The password is fed on stdin
  # so it never appears in the redis-server process arguments.
  redis:
    image: redis:8.8.4-alpine3.23@sha256:ab669f1420eaa05360a417b24f3bd210c9272e2c79a4bb35d3e50b4bfd50dbee
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - printf 'requirepass %s\n' "$$REDIS_PASSWORD" | exec redis-server - --save '' --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # --- Observability stack ---------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-3d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=   # single instance: no gossip port
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # Loki and Alloy images are distroless (no shell/wget), so they have no container
  # healthcheck; Blackbox probes their /ready endpoints and `make health` checks them.
  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: [-config.file=/etc/loki/loki.yml]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki:/etc/loki:ro
      - loki-data:/loki
    restart: unless-stopped
    logging: *logging

  # Runs as root: it reads the Docker socket (root:root 0660 in OrbStack's VM).
  # SECURITY: ":ro" on a socket does NOT restrict the Docker API (verified: a container
  # was created through it). Socket access = root on the host. See docs: socket proxy
  # planned before AWS deployment.
  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/host/var/log:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 13 otherwise downloads ~430 MB of unpinned, auto-updating plugins at
      # startup. Prometheus/Loki/Alertmanager datasources are built in and don't need them.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    logging: *logging

  # --- Exporters (not published; scraped over the compose network) -----------

  # Reports the OrbStack Linux VM locally (real host on EC2). Bridge networking,
  # so network metrics cover this container only; per-container traffic comes from cAdvisor.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command: [--path.rootfs=/host]
    pid: host
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # Needs root and host mounts to read cgroups and Docker metadata. The /var/run mount
  # includes the Docker socket: same root-equivalent caveat as Alloy above.
  # cAdvisor reaches Docker containers via containerd. OrbStack runs it under
  # /run/docker/containerd; stock Ubuntu Docker uses /run/containerd (set the var on EC2).
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    command:
      - --containerd=${CADVISOR_CONTAINERD_SOCKET:-/var/run/docker/containerd/containerd.sock}
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    logging: *logging

  blackbox:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    user: "65534:65534"
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./observability/blackbox:/etc/blackbox:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9115/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # One-shot tool containers (profile "tools"): `make aws ARGS=...`, `make tf ARGS=...`.
  # Credentials and endpoint are hardcoded to Floci on purpose and ~/.aws is never
  # mounted, so these containers cannot reach real AWS.
  aws:
    image: amazon/aws-cli:2.38.6@sha256:bdb0dd07c54dfc7fe6526387dcf23eaab269875a20d647ae4de8196ea04d6bd4
    profiles: [tools]
    environment: &local-aws
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ENDPOINT_URL: http://floci:4566
    working_dir: /work
    volumes:
      - ./:/work
    depends_on:
      floci:
        condition: service_healthy

  k6:
    image: grafana/k6:1.8.2@sha256:00fdcebafbc86cb0137d429529b1caa401a02e09025f02fc74866fa6e2b004d8
    profiles: [tools]
    environment:
      BASE_URL: http://ecommerce-api:3000
    volumes:
      - ./tests/load:/scripts:ro
    depends_on:
      ecommerce-api:
        condition: service_healthy

  terraform:
    image: hashicorp/terraform:1.16.7@sha256:c9c77f5b9820832cbc7b88d16df406ac6e75fee5a9077e5437db0c54e5ff33e3
    profiles: [tools]
    environment:
      <<: *local-aws
      TF_PLUGIN_CACHE_DIR: /plugin-cache
      TF_IN_AUTOMATION: "1"
    working_dir: /work
    volumes:
      - ./:/work
      - tf-plugin-cache:/plugin-cache
    depends_on:
      floci:
        condition: service_healthy

volumes:
  floci-data:
  tf-plugin-cache:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
  postgres-data:
